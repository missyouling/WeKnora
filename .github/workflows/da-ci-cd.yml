name: Daily-Affairs Sandbox CI/CD

on:
  push:
    # v4 是当前二开分支（2026-10 起）；保留 v3 以免旧分支改动失去门禁。
    branches: [daily-affairs-v3, daily-affairs-v4]
    tags: ['v*-da']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: missyouling/weknora-da

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      # type-check 必须走 npm script：vue-tsc 默认 V8 堆上限（约 2GB）会 OOM，
      # package.json 里已固化为 node --max-old-space-size=8192。
      - name: Type check (frontend)
        run: cd frontend && npm run type-check
      # ESLint：error 级会阻断（当前已清零），warning 级为存量风格债不阻断。
      - name: Lint (frontend)
        run: cd frontend && npm run lint
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Install CGO dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libsqlite3-dev
      - name: Vet whitelisted packages
        run: go vet ./internal/handler ./internal/application/service ./internal/router ./internal/container ./internal/middleware ./internal/types ./internal/event ./internal/common ./internal/config ./internal/ratelimit ./internal/storageallowlist
      # 二开业务包：沿用 -run 正则白名单，隔离上游官方可能损坏的同包测试。
      - name: Test sandbox packages (whitelist regex)
        env:
          CGO_ENABLED: 1
        run: go test -run "TestBusiness|TestExtract|TestDailyAffairs" ./internal/handler ./internal/application/service
      # 核心包：这些包在 VM 上稳定通过，且只依赖 miniredis / 内存 SQLite，无需外部服务，
      # 故跑全量测试（不加 -run 过滤）。继续保持逐包显式指定，禁止改成 ./...。
      # 新增包前必须先在 VM 跑通并确认无 Redis/Postgres/网络依赖，否则 CI 必然红。
      - name: Test core packages (whitelist, full)
        env:
          CGO_ENABLED: 1
        run: go test ./internal/router ./internal/container ./internal/middleware ./internal/types ./internal/event ./internal/common ./internal/config ./internal/ratelimit ./internal/storageallowlist

  build-push:
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=da-latest
            type=sha,prefix=da-
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.da
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
